<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background shape: A stylized, solid foundation representing structure and evidence -->

  <rect x="5" y="5" width="50" height="50" rx="10" fill="#3B82F6"/>

  

  <!-- Central Element: A combination of a report/document and an analysis graph, symbolizing 'Analysis & Reporting' and 'Transcription' -->

  

  <!-- Document Shape (Report) -->

  <path d="M15 15C15 13.8954 15.8954 13 17 13H43C44.1046 13 45 13.8954 45 15V45C45 46.1046 44.1046 47 43 47H17C15.8954 47 15 46.1046 15 45V15Z" fill="#FFFFFF"/>

  

  <!-- Analysis Lines/Bars (Representing structured data/transcripts/signal) -->

  <!-- Line 1 -->

  <rect x="20" y="20" width="20" height="4" rx="1" fill="#3B82F6"/>

  <!-- Line 2 -->

  <rect x="20" y="27" width="16" height="4" rx="1" fill="#3B82F6"/>

  <!-- Line 3 (Shorter, lower confidence/less speaking time, representing 'Signal Quality Safeguards') -->

  <rect x="20" y="34" width="12" height="4" rx="1" fill="#3B82F6"/>

  

  <!-- The 'Hire'/Decision point (A checkmark, implying successful conversion of analysis into a decision artifact) -->

  <path d="M40 18L30 38L25 33" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  

  <!-- Outer Ring (Optional: Reinforcing 'Structure' and 'Consistency') -->

  <!-- <circle cx="30" cy="30" r="28" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2"/> -->

</svg>

